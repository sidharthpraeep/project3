apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: e-commcluster
  region: ap-south-1
  version: "1.30"

iam:
  withOIDC: true

availabilityZones:
  - ap-south-1a
  - ap-south-1b   # ✅ required second AZ

vpc:
  nat:
    gateway: Disable

managedNodeGroups:
  - name: nodegrp

    instanceTypes:
      - t3.micro
      - t3.small
      - t3a.micro   # ✅ fallback handles AZ capacity issues

    desiredCapacity: 1
    minSize: 1
    maxSize: 2

    volumeSize: 20   # ✅ critical fix

    privateNetworking: false